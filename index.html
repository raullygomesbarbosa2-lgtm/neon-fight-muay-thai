let fighter=null,enemy=null,clock=new THREE.Clock(),state={hp:100,ehp:100,act:'idle',t:0,x:0,z:0,guard:true};
function rigCharacter(root,scale=1,position=new THREE.Vector3(),rotationY=0,enemyTint=false){
 const source=[];root.traverse(o=>{if(o.isMesh)source.push(o)});if(!source.length)throw Error('Malha não encontrada');
 const old=source[0], parent=old.parent, skinned=new THREE.SkinnedMesh(old.geometry.clone(),old.material.clone());
 skinned.name='MuayThaiSkinnedMesh';skinned.position.set(0,0,0);skinned.scale.setScalar(scale);skinned.castShadow=true;skinned.receiveShadow=true;
 if(enemyTint){skinned.material=Array.isArray(skinned.material)?skinned.material.map(m=>m.clone()):skinned.material.clone();for(const m of (Array.isArray(skinned.material)?skinned.material:[skinned.material])){m.color.set(0xccaaff);m.emissive=new THREE.Color(0x26001f);m.emissiveIntensity=.25}}
 parent.remove(old);parent.add(skinned);
 const V=(x,y,z=0)=>new THREE.Vector3(x,y,z); // joints in centered GLB mesh coordinates
 const pts={pelvis:V(0,-.02,0),chest:V(0,.20,0),neck:V(0,.34,0),head:V(0,.43,0),
 Lshoulder:V(-.065,.21,0),Lelbow:V(-.14,.115,.025),Lwrist:V(-.105,.28,.095),Lhand:V(-.055,.35,.12),
 Rshoulder:V(.065,.21,0),Relbow:V(.14,.115,.025),Rwrist:V(.105,.28,.095),Rhand:V(.055,.35,.12),
 Lhip:V(-.055,-.025,0),Lknee:V(-.08,-.245,.015),Lankle:V(-.085,-.425,0),Lfoot:V(-.085,-.465,.075),
 Rhip:V(.055,-.025,0),Rknee:V(.08,-.245,-.015),Rankle:V(.085,-.425,0),Rfoot:V(.085,-.465,.075)};
 const bones={};function bone(name, parentBone, point){let b=new THREE.Bone();b.name='Muay_'+name; b.position.copy(parentBone?pts[point].clone().sub(pts[parentBone.userData.joint]):pts[point]);b.userData.joint=point;if(parentBone)parentBone.add(b);else root.add(b);bones[name]=b;return b}
 // Skeleton with sensible anatomical parentage; joints rest in a stable Muay Thai guard.
 const pelvis=bone('Pelvis',null,'pelvis'), chest=bone('Spine',pelvis,'chest'), neck=bone('Neck',chest,'neck'), head=bone('Head',neck,'head');
 const ls=bone('LShoulder',chest,'Lshoulder'), le=bone('LElbow',ls,'Lelbow'), lw=bone('LWrist',le,'Lwrist'), lh=bone('LHand',lw,'Lhand');
 const rs=bone('RShoulder',chest,'Rshoulder'), re=bone('RElbow',rs,'Relbow'), rw=bone('RWrist',re,'Rwrist'), rh=bone('RHand',rw,'Rhand');
 const lhip=bone('LHip',pelvis,'Lhip'), lk=bone('LKnee',lhip,'Lknee'), la=bone('LAnkle',lk,'Lankle'), lf=bone('LFoot',la,'Lfoot');
 const rhip=bone('RHip',pelvis,'Rhip'), rk=bone('RKnee',rhip,'Rknee'), ra=bone('RAnkle',rk,'Rankle'), rf=bone('RFoot',ra,'Rfoot');
 root.updateMatrixWorld(true);
 // Nearest-joint smooth skin weights, normalized per vertex. Deliberately exclude opposite-side limbs.
 const geo=skinned.geometry, pos=geo.getAttribute('position'), names=Object.keys(pts), ids=new Uint16Array(pos.count*4), ws=new Float32Array(pos.count*4);
 function group(n){if(n.startsWith('L'))return 'L';if(n.startsWith('R'))return 'R';if(['pelvis','Lhip','Rhip','Lknee','Rknee','Lankle','Rankle','Lfoot','Rfoot'].includes(n))return 'lower';return 'upper'}
 for(let i=0;i<pos.count;i++){
   let x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i), g=y<-.015?'lower':'upper';
   let candidates=names.filter(n=>{let q=group(n);return q==='lower'?g==='lower':q==='upper'?g==='upper':true});
   candidates.sort((a,b)=>{let A=pts[a],B=pts[b],da=(x-A.x)**2+(y-A.y)**2+(z-A.z)**2,db=(x-B.x)**2+(y-B.y)**2+(z-B.z)**2;return da-db});
   let top=candidates.slice(0,4), vals=top.map(n=>1/Math.max(0.001,((x-pts[n].x)**2+(y-pts[n].y)**2+(z-pts[n].z)**2)));
   let sum=vals.reduce((a,b)=>a+b,0)||1;for(let k=0;k<4;k++){ids[i*4+k]=Object.keys(bones).findIndex(n=>bones[n].userData.joint===top[k]);ws[i*4+k]=vals[k]/sum;}
 }
 geo.setAttribute('skinIndex',new THREE.Uint16BufferAttribute(ids,4));geo.setAttribute('skinWeight',new THREE.Float32BufferAttribute(ws,4));
 let skeleton=new THREE.Skeleton(Object.values(bones));skinned.bind(skeleton);skinned.normalizeSkinWeights();
 const rig=new THREE.Group();rig.name='NewMuayThaiRig';rig.position.y=.5;root.add(rig); // parent container for placement/orientation

function poseCharacter(c,act,pulse=0){const b=c.bones; b.Spine.rotation.z=Math.sin(clock.elapsedTime*2.2)*.025; b.Head.rotation.z=-.015; b.LShoulder.rotation.z=-.04;b.RShoulder.rotation.z=.04;b.LElbow.rotation.x=-.04;b.RElbow.rotation.x=-.04;
 if(act==='punch'){b.RShoulder.rotation.z=-.36*pulse;b.RElbow.rotation.z=.14*pulse;b.Spine.rotation.y=-.06*pulse;}
 if(act==='kick'){b.RHip.rotation.z=-.26*pulse;b.RKnee.rotation.z=.16*pulse;b.Spine.rotation.y=.05*pulse;}
 if(act==='guard'){b.LShoulder.rotation.z=-.06;b.RShoulder.rotation.z=.06;}
}

const held=new Set();function perform(a){if(!fighter)return;if(['punch','kick'].includes(a)){state.act=a;state.t=0;document.getElementById('msg').textContent=a==='punch'?'SOCO!':'CHUTE!';document.getElementById('msg').style.opacity=1;setTimeout(()=>document.getElementById('msg').style.opacity=0,420);if(Math.random()<.78){state.ehp=Math.max(0,state.ehp-(a==='kick'?12:7));document.getElementById('hp2').style.width=state.ehp+'%'}if(state.ehp===0){document.getElementById('msg').textContent='K.O.!';document.getElementById('msg').style.opacity=1}}else if(a==='guard'){state.guard=!state.guard;state.act=state.guard?'guard':'idle'}else if(a==='up'){state.z=Math.max(-.55,state.z-.1)}else if(a==='down'){state.z=Math.min(.6,state.z+.1)}else if(a==='left'){state.x=Math.max(-1.45,state.x-.16)}else if(a==='right'){state.x=Math.min(1.45,state.x+.16)}}
document.querySelectorAll('[data-action]').forEach(b=>{let a=b.dataset.action;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('down');held.add(a);perform(a)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove('down');held.delete(a)}))});
document.getElementById('reset').addEventListener('click',()=>{state.hp=state.ehp=100;state.x=state.z=0;state.guard=true;state.act='idle';document.getElementById('hp1').style.width=document.getElementById('hp2').style.width='100%';document.getElementById('msg').style.opacity=0});
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(fighter){state.t+=dt;let pulse=state.act==='punch'||state.act==='kick'?Math.sin(Math.min(state.t/.48,1)*Math.PI):0;if(pulse===0&&state.act!=='idle'&&state.act!=='guard')state.act=state.guard?'guard':'idle';fighter.root.position.x=-.32+state.x+(pulse*.08);fighter.root.position.z=state.z;fighter.rig.position.y=Math.sin(clock.elapsedTime*5)*.008;poseCharacter(fighter,state.act,pulse);if(enemy){enemy.root.position.x=1.3+Math.sin(clock.elapsedTime*.65)*.12;poseCharacter(enemy,'guard',0);if(Math.random()<.003&&state.ehp>0){state.hp=Math.max(0,state.hp-3);document.getElementById('hp1').style.width=state.hp+'%'}}}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
